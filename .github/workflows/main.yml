name: Build UrduSikhe APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

           - name: Build Debug APK
        run: |
          cd UrduSikhe_APK_Build_Ready/UrduSikhe_Android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UrduSikhe-APK
          path: UrduSikhe_APK_Build_Ready/UrduSikhe_Android/app/build/outputs/apk/debug/*.apk
       
         
